[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pronunciation-backend"
version = "0.1.0"
description = "Backend MVP for word-level American English pronunciation assessment."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "numpy>=1.26.0",
  "pydantic>=2.8.0",
  "soundfile>=0.12.1",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30.0",
  # CUDA 12.8 wheels (matches typical Linux drivers reporting CUDA 12.8 in nvidia-smi).
  # Avoid the PyPI default on Linux, which can resolve to CUDA 13.x and fail on older drivers.
  "torch>=2.9.0",
  "transformers>=4.44,<5",
]

[dependency-groups]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.2.0",
  "pyarrow>=15.0.0",
]

[tool.uv]
# `uv sync` installs only [project] dependencies (production / API).
# `uv sync --group dev` adds tests, HTTP client, and Parquet for training pipelines.
# (There is no `uv sync --dev` flag; use `--group dev`.)
default-groups = []

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

# MFA is intentionally not declared here.
# On Linux it should live in a separate micromamba/conda environment rather than uv/pip.

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
